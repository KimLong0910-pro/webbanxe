<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Xe - Showroom 4TL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden shadow-2xl" id="detailContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = parseInt(urlParams.get('id')) || 1;
        const cars = JSON.parse(localStorage.getItem('cars_data')) || [];
        const car = cars.find(c => c.id === id) || cars[0];

        if (car) {
            document.getElementById('detailContainer').innerHTML = `
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <a href="index.html" class="text-gray-400 hover:text-white">&larr; Quay lại Showroom</a>
                    <span class="text-red-500 font-bold">${car.brand}</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
                    <div>
                        <img src="${car.image}" class="w-full h-72 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/500x350'">
                    </div>
                    <div class="space-y-4">
                        <h1 class="text-3xl font-extrabold text-white">${car.name}</h1>
                        <div class="text-2xl font-bold text-red-500">${Number(car.price).toLocaleString('vi-VN')} VNĐ</div>
                        
                        <div class="bg-gray-700/50 p-4 rounded-lg space-y-2 text-sm">
                            <div><span class="text-gray-400">Động cơ:</span> ${car.engine || 'V8 / V12 Twin-Turbo'}</div>
                            <div><span class="text-gray-400">Hộp số:</span> ${car.transmission || 'Tự động 8 cấp ly hợp kép'}</div>
                            <div><span class="text-gray-400">Nhiên liệu:</span> ${car.fuel || 'Xăng / Hybrid'}</div>
                        </div>

                        <p class="text-gray-300 text-sm leading-relaxed">${car.description}</p>
                        
                        <button onclick="alert('Vui lòng liên hệ Hotline: 0900.xxx.xxx để đặt mua xe!')" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-bold transition">Liên Hệ Tư Vấn</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
